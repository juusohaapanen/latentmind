[project]
name = "latentmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.6",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "mcp>=1.0",
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
latentmind       = "latentmind:cli"
latentmind-mcp   = "mcp_server:mcp.run"
latentmind-bench = "benchmark:main"

[tool.setuptools]
packages = ["latentmind"]
py-modules = ["mcp_server", "benchmark"]

[dependency-groups]
dev = [
    "pytest>=8",
]
bench = [
    "datasets>=2.20",
    "anthropic>=0.40",
]

[tool.pytest.ini_options]
pythonpath = ["."]
